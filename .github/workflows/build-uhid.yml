name: Build uhid.ko for Kindle Oasis 1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:18.04
    steps:
      - name: Install dependencies and cross compiler
        run: |
          apt-get update
          apt-get install -y wget tar bc libssl-dev make gcc gcc-arm-linux-gnueabihf

      - name: Download and extract kernel source
        run: |
          mkdir kernel
          cd kernel
          wget -q https://kindledownloads.s3.amazonaws.com/Kindle_src_5.16.2.1.1_4097550002.tar.gz
          tar -xf Kindle_src_5.16.2.1.1_4097550002.tar.gz gplrelease/linux-3.0.35.tar.gz
          tar -xf gplrelease/linux-3.0.35.tar.gz

      - name: Configure kernel
        run: |
          cd kernel
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- imx60_wario_defconfig
          echo "CONFIG_UHID=m" >> .config
          sed -i 's/CONFIG_FB_MXC_EINK_V2_PANEL=y/CONFIG_FB_MXC_EINK_V2_PANEL=n/' .config
          sed -i 's/CONFIG_FB_MXC_EINK_PANEL=y/CONFIG_FB_MXC_EINK_PANEL=n/' .config
          yes "" | make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- oldconfig

      - name: Patch compiler header
        run: |
          cd kernel
          cp include/linux/compiler-gcc6.h include/linux/compiler-gcc7.h

      - name: Build vmlinux and modules
        run: |
          cd kernel
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- vmlinux modules -j$(nproc)

      - name: Build uhid.ko
        run: |
          cd kernel
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- M=drivers/hid modules -j$(nproc)
          cp drivers/hid/uhid.ko ../uhid-3.0.35-lab126-409755-wario.ko

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uhid-ko
          path: uhid-3.0.35-lab126-409755-wario.ko
